# Local Graphify MCP stack.
# Host binds to 127.0.0.1 by default — do not publish on 0.0.0.0.
#
# Usage:
#   docker compose up -d --build
#   docker compose down
#
# Configuration: copy `.env.example` to `.env` (optional).

services:
  graphify-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: graphify-mcp-local:0.9.53
    container_name: graphify-mcp-local
    restart: unless-stopped
    ports:
      # Host bind stays local-only; container listens on 0.0.0.0 internally.
      - "${MCP_HOST_BIND:-127.0.0.1}:${MCP_HOST_PORT:-8765}:${MCP_CONTAINER_PORT:-8080}"
    volumes:
      # Mount generated graph; regenerating graph.json does not require image rebuild.
      - "${GRAPH_PATH:-./graph/graph.json}:/data/graph.json:ro"
    environment:
      GRAPH_PATH: /data/graph.json
      MCP_HOST: ${MCP_CONTAINER_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_CONTAINER_PORT:-8080}
      GRAPHIFY_API_KEY: ${GRAPHIFY_API_KEY:-}
    command:
      - /data/graph.json
      - --transport
      - http
      - --host
      - ${MCP_CONTAINER_HOST:-0.0.0.0}
      - --port
      - ${MCP_CONTAINER_PORT:-8080}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,socket; p=int(os.environ.get('MCP_PORT','8080')); s=socket.create_connection(('127.0.0.1',p),3); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
